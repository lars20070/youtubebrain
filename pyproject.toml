[project]
name = "youtubebrain"
version = "0.1.0"
description = "markdown knowledge base generated from your watched YouTube videos"
readme = "README.md"
authors = [{ name = "Lars Nilse", email = "l.nilse@dunelm.org.uk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "bertopic>=0.16,<0.18",
  "hdbscan>=0.8",
  "httpx>=0.27",
  "loguru>=0.7.3",
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "python-dotenv>=1.0",
  "pydantic>=2.10.6",
  "pydantic-ai-slim[openai,openrouter]>=1.0",
  "pyyaml>=6.0",
  "pytubefix>=10.6",
  "requests>=2.32",
  "sentence-transformers>=3.0,<4",
  "umap-learn>=0.5",
  "youtube-transcript-api>=1.2.4",
  "yt-dlp>=2026.6.9",
]

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.3",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.6.1",
  "respx>=0.21",
  "ruff>=0.9.5",
]

[project.scripts]
descriptions = "youtubebrain.descriptions:main"
transcripts = "youtubebrain.transcripts:main"
summaries = "youtubebrain.summaries:main"
markdown = "youtubebrain.markdown:main"
embed = "youtubebrain.embeddings:main"
cluster = "youtubebrain.clusters:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "TID", # tidy imports
  "UP",  # pyupgrade
  "C4",  # comprehensions
  "SIM", # simplifications
  "PD",  # pandas-specific rules
  "NPY", # numpy-specific rules
  "PL",  # pylint
  "B",   # bugbear
  "ANN", # type annotations
  "TC",  # type checking
]
ignore = [
  "SIM108",  # Ignore ternary operators rule i.e. allow if-else blocks
  "PLR2004", # Allow magic values
  "PLR0915", # Allow long functions
  "PLR0912", # Allow many branches
  "PLR0913", # Allow many arguments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = ["-m", "not paid and not ollama and not slow_embedding and not slow_clustering", "--cov"] # Skip tests that require a paid API key, local Ollama, a real SentenceTransformer download, or a real BERTopic fit; collect coverage
asyncio_default_fixture_loop_scope = "session" # Use a single event loop for all tests. Switch to "function" for a new event loop for every test (more isolation).
markers = [
  "paid: tests requiring a paid API key",
  "ollama: tests requiring a running local Ollama server",
  "slow_embedding: tests downloading a real SentenceTransformer model",
  "slow_clustering: tests running a real BERTopic fit over synthetic vectors",
]

[tool.coverage.run]
branch = true
source = ["youtubebrain"]
parallel = true
disable_warnings = ["module-not-measured"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true  # Show line numbers of missing coverage in terminal
skip_covered = false # Show all files, including those with full coverage
skip_empty = true    # Skip files with no statements

[tool.coverage.html]
directory = "coverage"
