name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    strategy:
      matrix:
        python-version: ["3.12"]
        uv-version: ["latest"]
        # Only run CI on Linux. Windows and macOS cost 2x and 10x more respectively.
        os: [ubuntu-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4.2.0
      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5.2.2
        with:
          version: ${{ matrix.uv-version }}
          enable-cache: true
      - name: Check uv version
        run: uv --version
      - name: Verify lock file is up to date
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}
      - name: Check installed dependencies
        run: |
          uv run python --version
          uv tree
      - name: Build the package
        run: uv build
      - name: Lint the package
        run: uvx ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run unit tests
        # -v verbose; marker filter comes from addopts in pyproject.toml
        # (skips paid, ollama, slow_embedding, slow_clustering)
        run: uv run pytest -v -n auto
      - name: Report coverage
        run: uv run coverage report
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtubebrain-pytest-logs
          path: youtubebrain.log
